blueprint:
  name: CBPi heartbeat watchdog
  description: >-
    Switches CraftBeerPi's MQTT actors off if CBPi dies, hangs or stops while
    they are on. Needs the cbpi4-heartbeat-watchdog CBPi plugin, which publishes
    every actor that is on, and its MQTT off payload, once a second.


    If the heartbeat goes silent for the timeout, or CBPi stops cleanly with
    actors still on, this publishes each one's off payload (retained, as CBPi
    does) and runs your alert actions. Actors that aren't MQTT actors (GPIO,
    relay boards) can't be switched off from here; they're named in the alert.


    The heartbeat says what to publish, so anyone who can publish to its topic
    could otherwise make HA publish anything. Only topics under the allowed
    prefixes, with a payload on the allowed off list, are ever published;
    anything else is refused and named in the alert. Restrict who can publish
    to the heartbeat topic with broker ACLs too.


    This is a convenience fallback, not a safety system. Fit hardwired
    over-temperature and dry-fire cutouts on every element.
  domain: automation
  source_url: https://github.com/Adamp457/cbpi4-heartbeat-watchdog/blob/main/blueprints/cbpi_heartbeat_watchdog.yaml
  input:
    heartbeat_topic:
      name: Heartbeat topic
      default: cbpi/heartbeat
      selector:
        text:
    timeout:
      name: Timeout
      description: Silence this long while actors are on counts as CBPi dead.
      default: 15
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: s
    allowed_topic_prefixes:
      name: Allowed actor topic prefixes
      description: Only actor topics starting with one of these are switched off.
      default: [cbpi/actor/]
      selector:
        text:
          multiple: true
    allowed_off_payloads:
      name: Allowed off payloads
      description: >-
        Exact payloads that may be published. The defaults are what CBPi's
        MQTTActor and Tasmota actor publish for off; add your GenericMqttActor's
        rendered off payload if you use one.
      default:
        - '{"state": "off", "power": 0}'
        - "OFF"
        - "off"
      selector:
        text:
          multiple: true
    latch_entity:
      name: Latch (optional)
      description: >-
        An input_boolean this turns on when it trips. While it's on, every beat
        that lists actors as on gets their off re-sent at once, so a CBPi that
        recovers from a hang can't keep them on for more than about a beat
        (PWM pulses up to a second are possible). Turn it off by hand to
        re-arm, after stopping the kettles in CBPi. Leave empty for no latch.
      default: ""
      selector:
        entity:
          domain: input_boolean
    alert_actions:
      name: Alert actions
      description: >-
        Run after switching off, e.g. a mobile notification. Variables:
        `message`, `reason`, `switched_off` and `not_switched` (lists of actor names).
      default: []
      selector:
        action:

mode: restart
max_exceeded: silent

triggers:
  - trigger: mqtt
    topic: !input heartbeat_topic

variables:
  timeout: !input timeout
  allowed_prefixes: !input allowed_topic_prefixes
  allowed_offs: !input allowed_off_payloads
  latch: !input latch_entity
  beat: "{{ trigger.payload_json if trigger.payload_json is mapping else {} }}"
  actors_on: "{{ beat.on | default([]) }}"

actions:
  - condition: template
    value_template: "{{ actors_on | count > 0 }}"
    note: Nothing on, nothing to protect. Restart mode has already cancelled any pending run.
  - variables:
      latched: "{{ latch is string and latch != '' and is_state(latch, 'on') }}"
  - if:
      - condition: template
        value_template: "{{ not latched and beat.state != 'stopped' }}"
    then:
      - delay:
          seconds: "{{ timeout }}"
        note: Each heartbeat restarts the run, so this only completes when they stop.
  - variables:
      reason: >-
        {{ 'Latched: CBPi still has actors on, off re-sent' if latched
           else 'CBPi stopped with actors still on' if beat.state == 'stopped'
           else 'No CBPi heartbeat for ' ~ timeout ~ ' s' }}
      to_switch: >-
        {% set ns = namespace(ok=[], hit=false) %}
        {% for a in actors_on if a.topic is string and a.off is string
             and a.off in allowed_offs and '#' not in a.topic and '+' not in a.topic %}
          {% set ns.hit = false %}
          {% for p in allowed_prefixes if a.topic.startswith(p) %}{% set ns.hit = true %}{% endfor %}
          {% if ns.hit %}{% set ns.ok = ns.ok + [a] %}{% endif %}
        {% endfor %}
        {{ ns.ok }}
      switched_off: "{{ to_switch | map(attribute='name') | list }}"
      not_switched: >-
        {{ actors_on | rejectattr('name', 'in', switched_off) | map(attribute='name') | list }}
      message: >-
        {{ reason }}. Switched off: {{ switched_off | join(', ') or 'none' }}.
        {%- if not_switched %} NOT switched off (not an MQTT actor, or topic/payload not
        on the allowlist): {{ not_switched | join(', ') }}.{% endif %}
  - repeat:
      for_each: "{{ to_switch }}"
      sequence:
        - action: mqtt.publish
          data:
            topic: "{{ repeat.item.topic }}"
            payload: "{{ repeat.item.off }}"
            retain: true
          continue_on_error: true
          note: Keep going so one bad topic doesn't leave the rest on.
  - condition: template
    value_template: "{{ not latched }}"
    note: While latched, re-send offs quietly; the trip already alerted.
  - if:
      - condition: template
        value_template: "{{ latch is string and latch != '' }}"
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: "{{ latch }}"
  - sequence: !input alert_actions
